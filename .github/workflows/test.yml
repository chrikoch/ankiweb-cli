name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest -v

  container:
    env:
      IMAGE_TAG: ankiweb-cli:ci-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[dev]"
      - name: Build image for this revision
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: docker build --label "org.opencontainers.image.revision=$SOURCE_REVISION" -t "$IMAGE_TAG" .
      - name: Check image architecture and CLI
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Architecture}}')" = "$EXPECTED_ARCH"
          docker run --rm "$IMAGE_TAG" --help
          docker run --rm "$IMAGE_TAG" ankiweb-backup --help
          if docker run --rm "$IMAGE_TAG" ankiweb-backup --invalid-option; then exit 1; fi
          docker run --rm --entrypoint python "$IMAGE_TAG" -c 'import importlib.metadata, platform; print(platform.python_version(), importlib.metadata.version("anki"), platform.machine())'
      - name: Check mounts and synthetic backup
        env:
          ANKIWEB_CONTAINER_IMAGE: ${{ format('ankiweb-cli:ci-{0}', matrix.arch) }}
        run: python -m pytest -v tests/test_container_mounts.py tests/test_container_backup_integration.py

      - name: Save the tested image
        run: |
          docker image inspect "$IMAGE_TAG" --format '{{json .Config}} {{json .RootFS.Layers}} {{.Os}} {{.Architecture}}' > "$RUNNER_TEMP/image-metadata.txt"
          docker save -o "$RUNNER_TEMP/image.tar" "$IMAGE_TAG"
          sha256sum "$RUNNER_TEMP/image.tar" | cut -d ' ' -f 1 > "$RUNNER_TEMP/image-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: container-image-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/image-metadata.txt
            ${{ runner.temp }}/image-sha256.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: container-backup-publication
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: container-image-*-${{ github.run_attempt }}
          path: images
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested images and create the revision manifest
        env:
          IMAGE: ghcr.io/chrikoch/ankiweb-cli
          SOURCE_REVISION: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            artifact="images/container-image-$arch-$RUN_ATTEMPT"
            image_tag="ankiweb-cli:ci-$arch"
            test "$(sha256sum "$artifact/image.tar" | cut -d ' ' -f 1)" = "$(cat "$artifact/image-sha256.txt")"
            docker load -i "$artifact/image.tar"
            docker image inspect "$image_tag" --format '{{json .Config}} {{json .RootFS.Layers}} {{.Os}} {{.Architecture}}' > "$RUNNER_TEMP/loaded-metadata.txt"
            cmp "$artifact/image-metadata.txt" "$RUNNER_TEMP/loaded-metadata.txt"
            test "$(docker image inspect "$image_tag" --format '{{.Architecture}}')" = "$arch"
            test "$(docker image inspect "$image_tag" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_REVISION"
            docker tag "$image_tag" "$IMAGE:$SOURCE_REVISION-$arch"
          done
          for arch in amd64 arm64; do
            docker push "$IMAGE:$SOURCE_REVISION-$arch" | tee "$RUNNER_TEMP/push-$arch.log"
            digest=$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$RUNNER_TEMP/push-$arch.log" | tail -n 1)
            test -n "$digest"
            printf '%s\n' "$IMAGE@$digest" > "$RUNNER_TEMP/reference-$arch.txt"
          done
          docker buildx imagetools create --tag "$IMAGE:$SOURCE_REVISION" \
            "$(cat "$RUNNER_TEMP/reference-amd64.txt")" "$(cat "$RUNNER_TEMP/reference-arm64.txt")"
      - name: Update latest only for the current main revision
        env:
          IMAGE: ghcr.io/chrikoch/ankiweb-cli
          SOURCE_REVISION: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" != "$SOURCE_REVISION" ]; then
            echo "Skipping latest: this revision is no longer the tip of main."
            exit 0
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE:$SOURCE_REVISION" | awk '$1 == "Digest:" {print $2; exit}')
          test -n "$digest"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$digest"
