name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest -v

  container:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[dev]"
      - run: docker build -t ankiweb-cli:ci .
      - name: Check image architecture and CLI
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(docker image inspect ankiweb-cli:ci --format '{{.Architecture}}')" = "$EXPECTED_ARCH"
          docker run --rm ankiweb-cli:ci --help
          docker run --rm ankiweb-cli:ci ankiweb-backup --help
          if docker run --rm ankiweb-cli:ci ankiweb-backup --invalid-option; then exit 1; fi
          docker run --rm --entrypoint python ankiweb-cli:ci -c 'import importlib.metadata, platform; print(platform.python_version(), importlib.metadata.version("anki"), platform.machine())'
      - name: Check mounts and synthetic backup
        env:
          ANKIWEB_CONTAINER_IMAGE: ankiweb-cli:ci
        run: python -m pytest -v tests/test_container_mounts.py tests/test_container_backup_integration.py
